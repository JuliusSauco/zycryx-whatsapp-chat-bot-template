name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zycryx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zycryx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zycryx_test
      BAILEYS_AUTH_STATE_SOURCE: database
      BOT_SECRETS_MASTER_KEY_B64: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Bootstrap PostgreSQL 18
        run: npm run db:setup

      - name: Encrypted auth integration
        run: npm run test:integration:auth

      - name: Durable report outbox integration
        run: npm run test:integration:outbox

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
